name: Terraform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  TF_VERSION: "1.10.3"
  WORKING_DIR: terraform
  AWS_REGION: ap-northeast-1
  # IAM Role ARN は GitHub リポジトリ変数 vars.IAM_ROLE_ARN に設定する
  # 設定場所: Settings > Secrets and variables > Variables > New repository variable
  # 値の例: arn:aws:iam::123456789012:role/portfolio-github-actions-role

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt
        run: terraform fmt --check --recursive
        working-directory: ${{ env.WORKING_DIR }}

  validate:
    name: Validate
    runs-on: ubuntu-latest
    env:
      TF_VAR_alert_email: ${{ secrets.TF_VAR_ALERT_EMAIL }}
      TF_VAR_github_repository: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init (no backend)
        run: terraform init -backend=false
        working-directory: ${{ env.WORKING_DIR }}

      - name: terraform validate
        run: terraform validate
        working-directory: ${{ env.WORKING_DIR }}

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [fmt, validate]
    steps:
      - uses: actions/checkout@v4

      - name: tfsec
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: ${{ env.WORKING_DIR }}
          soft_fail: true

  plan:
    name: Plan
    runs-on: ubuntu-latest
    needs: [fmt, validate]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      # OIDC トークン取得に必要
      id-token: write
    env:
      TF_VAR_alert_email: ${{ secrets.TF_VAR_ALERT_EMAIL }}
      TF_VAR_github_repository: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # OIDC で IAM Role を assume（アクセスキー不要）
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.IAM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        run: terraform init
        working-directory: ${{ env.WORKING_DIR }}

      - name: terraform plan
        id: plan
        run: terraform plan -no-color 2>&1 | tee plan_output.txt
        working-directory: ${{ env.WORKING_DIR }}
        continue-on-error: true

      - name: PRにplanの結果をコメント
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.WORKING_DIR }}/plan_output.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.slice(0, 60000) + '\n...(省略)' : plan;
            const status = '${{ steps.plan.outcome }}' === 'success' ? '✅' : '❌';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ${status} Terraform Plan\n\`\`\`hcl\n${truncated}\n\`\`\``
            });

      - name: planが失敗したらCIを落とす
        if: steps.plan.outcome == 'failure'
        run: exit 1
